<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockiscope Analytics</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-top: #190F32;
    --bg-bottom: #2D1450;
    --text: #E6DCFF;
    --text-dim: rgba(230,220,255,0.5);
    --accent: #C8AAFF;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --green: #7BE0AD;
    --red: #FF8A9B;
    --yellow: #FFD07B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  header {
    text-align: center;
    padding: 32px 0 24px;
  }
  header .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  header .logo {
    height: 56px;
    width: auto;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
  header .links {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
  }
  header .links a {
    display: inline-flex;
    opacity: 0.6;
    transition: opacity 0.15s, transform 0.15s;
  }
  header .links a:hover { opacity: 1; transform: translateY(-1px); }
  header .links img { width: 22px; height: 22px; display: block; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    max-width: 1200px;
    margin: 0 auto 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .stat-card .value {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto 20px;
  }
  .grid .wide { grid-column: 1 / -1; }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .panel { overflow: hidden; min-width: 0; }
  .chart-wrap { position: relative; overflow: hidden; width: 100%; }

  .game-log {
    max-width: 1200px;
    margin: 0 auto;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-bar .chip {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-bar .chip:hover, .filter-bar .chip.active {
    background: rgba(200,170,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 11px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--card-border);
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .correct { color: var(--green); }
  .wrong { color: var(--red); }
  .pending { color: var(--text-dim); font-style: italic; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .tag-w { background: rgba(123,224,173,0.15); color: var(--green); }
  .tag-l { background: rgba(255,138,155,0.15); color: var(--red); }
  .tag-na { background: rgba(255,255,255,0.05); color: var(--text-dim); }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 16px 0 4px;
  }
  .pagination button {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pagination button:hover { border-color: var(--accent); color: var(--accent); }
  .pagination button.active { background: rgba(200,170,255,0.15); border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: 0.3; cursor: default; }
  .pagination .page-info { color: var(--text-dim); font-size: 12px; padding: 0 8px; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    header { padding: 20px 0 16px; }
    header .title-row { gap: 10px; }
    header .logo { height: 38px; }
    header h1 { font-size: 22px; }
    header p { font-size: 12px; }
    .stats-row { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { padding: 14px 10px; }
    .stat-card .value { font-size: 24px; }
    .stat-card .label { font-size: 10px; }
    .grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
    .panel { padding: 14px; border-radius: 10px; }
    .panel h2 { font-size: 12px; margin-bottom: 10px; }
    .chart-wrap:not(.keep) { height: 220px !important; }
    .filter-bar { gap: 6px; }
    .filter-bar .chip { font-size: 11px; padding: 6px 10px; }
    table { font-size: 12px; }
    th, td { padding: 6px 6px; }
    th { font-size: 10px; }
    .pagination button { padding: 8px 14px; font-size: 14px; }
    .pagination { gap: 6px; }
  }

  /* ── season navigation ── */
  .nav {
    max-width: 1200px;
    margin: 0 auto 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip-row .chip {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .chip-row .chip:hover, .chip-row .chip.active {
    background: rgba(200,170,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .chip-row .chip .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 6px; vertical-align: 1px;
  }
  .tabs .chip { border-radius: 8px; }

  /* ── phase banner ── */
  .banner {
    max-width: 1200px;
    margin: 0 auto 16px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid rgba(200,170,255,0.25);
    background: linear-gradient(90deg, rgba(200,170,255,0.10), rgba(200,170,255,0.03));
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .banner .emoji { font-size: 28px; line-height: 1; }
  .banner .main { flex: 1; min-width: 200px; }
  .banner .headline { font-weight: 700; color: var(--accent); font-size: 16px; }
  .banner .sub { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .banner .side { color: var(--text); font-size: 13px; text-align: right; }
  .banner .side b { color: var(--accent); font-size: 22px; display: block; }

  /* ── cards & feeds ── */
  .note { color: var(--text-dim); font-size: 13px; font-style: italic; text-align: center; max-width: 1200px; margin: -8px auto 16px; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 14px; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 10px; }
  .adoptions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .adopt-card {
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px;
    background: rgba(255,255,255,0.02);
  }
  .adopt-card.current { border-color: var(--accent); background: rgba(200,170,255,0.08); }
  .adopt-card.champ { border-color: var(--yellow); background: rgba(255,208,123,0.08); }
  .adopt-card .team { font-weight: 700; font-size: 15px; }
  .adopt-card .when { color: var(--text-dim); font-size: 12px; margin: 4px 0 8px; }
  .adopt-card .reading { font-size: 12px; line-height: 1.6; }
  .adopt-card .fate { font-size: 12px; font-weight: 600; margin-top: 8px; }
  .fate.alive { color: var(--green); }
  .fate.out { color: var(--red); }
  .fate.won { color: var(--yellow); }
  .report { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .report .item { border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .report .item .k { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .feed { list-style: none; }
  .feed li { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: flex-start; }
  .feed .icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
  .feed .body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; }
  .feed .meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  a.post-link { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; }
  a.post-link:hover { text-decoration: underline; }
  tr.clickable { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  @media (max-width: 768px) {
    .banner { padding: 12px; gap: 10px; }
    .banner .side { text-align: left; }
    .chip-row .chip { font-size: 12px; padding: 6px 11px; }
    .feed li { gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <img class="logo" src="https://rockiscope.s3.us-east-1.amazonaws.com/rockiscope.png" alt="Rockiscope">
    <h1>Rockiscope Analytics</h1>
  </div>
  <p>Colorado Rockies prediction performance &mdash; powered by the cosmos</p>
  <div class="links">
    <a href="https://github.com/tlugger/rockiscope" target="_blank" rel="noopener" title="View source on GitHub" aria-label="GitHub repository">
      <img src="https://cdn.simpleicons.org/github/C8AAFF" alt="GitHub">
    </a>
    <a href="https://bsky.app/profile/rockiscope.bsky.social" target="_blank" rel="noopener" title="Follow on Bluesky" aria-label="Bluesky profile">
      <img src="https://cdn.simpleicons.org/bluesky/C8AAFF" alt="Bluesky">
    </a>
  </div>
</header>

<div id="banner"></div>
<nav class="nav" aria-label="Seasons">
  <div class="chip-row" id="seasonBar" role="tablist"></div>
  <div class="chip-row tabs" id="viewTabs" role="tablist"></div>
</nav>
<main id="view"></main>

<script>
// Chart colors are validated for color-vision deficiency against the dark
// surface (dataviz validator): correct/win, wrong/loss, primary, secondary.
const COLORS = {
  accent: '#C8AAFF',
  good: '#2FA3BC',
  bad: '#D9587D',
  primary: '#9C7BE6',
  secondary: '#B5862A',
  neutral: 'rgba(230,220,255,0.28)',
  text: '#E6DCFF',
  textDim: 'rgba(230,220,255,0.5)',
  grid: 'rgba(255,255,255,0.06)',
  surface: '#22123F',
};
const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { labels: { color: COLORS.textDim, font: { size: 11 }, usePointStyle: true } },
    tooltip: {
      backgroundColor: '#1E1240',
      borderColor: 'rgba(200,170,255,0.3)',
      borderWidth: 1,
      titleColor: COLORS.accent,
      bodyColor: COLORS.text,
      cornerRadius: 8,
      padding: 10,
    }
  },
  scales: {
    x: { ticks: { color: COLORS.textDim, font: { size: 10 } }, grid: { color: COLORS.grid } },
    y: { ticks: { color: COLORS.textDim, font: { size: 10 } }, grid: { color: COLORS.grid } }
  }
};

const FACTORS = [
  ['winRate', 'Win Rate'], ['pitcher', 'Pitcher'], ['h2h', 'H2H'],
  ['homeAway', 'Home/Away'], ['momentum', 'Momentum'], ['stars', 'Stars'],
];
const DEFAULT_WEIGHTS = { winRate: 0.25, pitcher: 0.35, h2h: 0.05, homeAway: 0.15, momentum: 0.10, stars: 0.10 };
const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const SIGN_EMOJI = { Aries:'♈', Taurus:'♉', Gemini:'♊', Cancer:'♋', Leo:'♌', Virgo:'♍', Libra:'♎', Scorpio:'♏', Sagittarius:'♐', Capricorn:'♑', Aquarius:'♒', Pisces:'♓' };
const TXN_EMOJI = { TR:'🔁', SFA:'✍️', CLW:'🪝', DES:'🚪', REL:'👋', DFA:'🕊️', R5:'🎲' };
const VIEWS = {
  regular: '⚾ Regular Season',
  postseason: '🍼 Postseason',
  spring: '🌵 Spring Training',
  hotstove: '🔥 Hot Stove',
};

const TEAM_ABBR = {
  'Arizona Diamondbacks': 'ARI', 'Atlanta Braves': 'ATL', 'Baltimore Orioles': 'BAL',
  'Boston Red Sox': 'BOS', 'Chicago Cubs': 'CHC', 'Chicago White Sox': 'CWS',
  'Cincinnati Reds': 'CIN', 'Cleveland Guardians': 'CLE', 'Colorado Rockies': 'COL',
  'Detroit Tigers': 'DET', 'Houston Astros': 'HOU', 'Kansas City Royals': 'KC',
  'Los Angeles Angels': 'LAA', 'Los Angeles Dodgers': 'LAD', 'Miami Marlins': 'MIA',
  'Milwaukee Brewers': 'MIL', 'Minnesota Twins': 'MIN', 'New York Mets': 'NYM',
  'New York Yankees': 'NYY', 'Oakland Athletics': 'OAK', 'Athletics': 'ATH', 'Philadelphia Phillies': 'PHI',
  'Pittsburgh Pirates': 'PIT', 'San Diego Padres': 'SD', 'San Francisco Giants': 'SF',
  'Seattle Mariners': 'SEA', 'St. Louis Cardinals': 'STL', 'Tampa Bay Rays': 'TB',
  'Texas Rangers': 'TEX', 'Toronto Blue Jays': 'TOR', 'Washington Nationals': 'WSH',
};

// ── helpers ──────────────────────────────────────────────────────────

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function isMobile() { return window.innerWidth < 768; }
function teamName(full) { return isMobile() ? (TEAM_ABBR[full] || full) : full; }
function shortTeam(full) {
  return String(full || '').replace(/^(Los Angeles|San Diego|San Francisco|New York) /, (_, c) =>
    ({ 'Los Angeles': 'LA ', 'San Diego': 'SD ', 'San Francisco': 'SF ', 'New York': 'NY ' })[c] || c + ' ');
}
function nickname(full) {
  const s = String(full || '');
  for (const two of ['Red Sox', 'White Sox', 'Blue Jays']) if (s.endsWith(two)) return two;
  return s.split(' ').pop();
}
function fmtDate(d, opts = { month: 'short', day: 'numeric' }) {
  if (!d) return '';
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, opts);
}
function pct(n, d) { return d ? Math.round((n / d) * 100) + '%' : '—'; }
function baseballPct(num, denom, label) {
  if (!denom) return { value: '—', label };
  const p = num / denom;
  const value = p.toFixed(3).replace(/^0/, '');
  const diff = p - 0.5;
  const sign = diff > 0 ? '+' : diff < 0 ? '−' : '';
  return { value, label: `${label} (${sign}${Math.abs(diff).toFixed(3).replace(/^0/, '')} vs .500)` };
}
function postLink(url, label = 'post ↗') {
  return url ? `<a class="post-link" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : '';
}
function statCards(cards) {
  return `<div class="stats-row">${cards.map(c =>
    `<div class="stat-card"><div class="value num">${esc(c.value)}</div><div class="label">${esc(c.label)}</div></div>`).join('')}</div>`;
}
function panel(title, body, { wide = false, id = '' } = {}) {
  return `<div class="panel${wide ? ' wide' : ''}"><h2${id ? ` id="${id}"` : ''}>${title}</h2>${body}</div>`;
}
// keep: hold this height on mobile too (charts with one row per category).
function canvas(id, height = 260, { keep = false } = {}) {
  return `<div class="chart-wrap${keep ? ' keep' : ''}" style="height:${height}px"><canvas id="${id}"></canvas></div>`;
}
function emptyState(emoji, text) {
  return `<div class="panel" style="max-width:1200px;margin:0 auto"><div class="empty"><span class="big">${emoji}</span>${text}</div></div>`;
}

let charts = [];
function chart(id, config) {
  const el = document.getElementById(id);
  if (!el) return;
  charts.push(new Chart(el, config));
}
function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }

async function getJSON(url) {
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error(`${url} returned ${resp.status}`);
  return resp.json();
}

// ── app state & routing ──────────────────────────────────────────────

const app = { status: null, seasons: [], details: {}, season: null, view: null };

function parseHash() {
  const [, season, view] = location.hash.split('/');
  return { season: season === 'all' ? 'all' : (parseInt(season, 10) || null), view: view || null };
}
function go(season, view) {
  const hash = season === 'all' ? '#/all' : `#/${season}${view ? '/' + view : ''}`;
  if (location.hash === hash) route(); else location.hash = hash;
}

function availableViews(d) {
  const v = [];
  if (d.regular.length) v.push('regular');
  if (d.postseason.adoptions.length || d.postseason.games.length) v.push('postseason');
  if (d.spring.length) v.push('spring');
  if (d.hotStove.length || (d.live && app.status?.phase === 'offseason')) v.push('hotstove');
  return v;
}

function defaultView(d, views) {
  if (d.live) {
    const byPhase = {
      'postseason': ['postseason', 'regular'],
      'offseason': ['hotstove', 'postseason', 'regular'],
      'spring-training': ['spring', 'hotstove', 'regular'],
      'regular-season': ['regular'],
    }[d.phase] || [];
    for (const v of byPhase) if (views.includes(v)) return v;
  }
  return views[0] || null;
}

async function route() {
  const { season, view } = parseHash();
  app.season = season || app.seasons.find(s => s.live)?.season || app.seasons[0]?.season || null;
  renderSeasonBar();
  destroyCharts();
  const main = document.getElementById('view');

  if (!app.season) {
    document.getElementById('viewTabs').innerHTML = '';
    main.innerHTML = emptyState('🔭', 'No predictions yet. The stars are still warming up.');
    return;
  }
  if (app.season === 'all') {
    document.getElementById('viewTabs').innerHTML = '';
    renderAllTime(main);
    return;
  }

  let d = app.details[app.season];
  if (!d) {
    main.innerHTML = '<div class="empty">Consulting the archives…</div>';
    try {
      d = app.details[app.season] = await getJSON(`/api/season/${app.season}`);
    } catch (e) {
      main.innerHTML = emptyState('🌑', `Couldn't load ${esc(app.season)}: ${esc(e.message)}`);
      return;
    }
  }
  const views = availableViews(d);
  app.view = views.includes(view) ? view : defaultView(d, views);
  renderTabs(views);

  if (!app.view) {
    main.innerHTML = emptyState('🌌', `Nothing tracked for ${esc(app.season)} yet.`);
    return;
  }
  ({ regular: renderRegular, postseason: renderPostseason, spring: renderSpring, hotstove: renderHotStove })[app.view](main, d);
}

function renderSeasonBar() {
  const chips = app.seasons.map(s => {
    const active = s.season === app.season ? ' active' : '';
    const dot = s.live ? '<span class="live-dot" title="Live"></span>' : '';
    return `<button class="chip${active}" role="tab" aria-selected="${!!active}" onclick="go(${s.season})">${dot}${s.season}</button>`;
  });
  if (app.seasons.length) {
    const active = app.season === 'all' ? ' active' : '';
    chips.push(`<button class="chip${active}" role="tab" aria-selected="${!!active}" onclick="go('all')">📚 All-time</button>`);
  }
  document.getElementById('seasonBar').innerHTML = chips.join('');
}

function renderTabs(views) {
  document.getElementById('viewTabs').innerHTML = views.length > 1 ? views.map(v =>
    `<button class="chip${v === app.view ? ' active' : ''}" role="tab" aria-selected="${v === app.view}" onclick="go(${app.season}, '${v}')">${VIEWS[v]}</button>`
  ).join('') : '';
}

// ── phase banner ─────────────────────────────────────────────────────

function renderBanner(s) {
  const el = document.getElementById('banner');
  if (!s || !s.phase) { el.innerHTML = ''; return; }
  const cd = s.countdown;
  const countdownSide = cd ? `<div class="side"><b class="num">${cd.days}</b>days to Opening Day</div>` : '';
  let emoji, headline, sub = '', side = '';

  switch (s.phase) {
    case 'postseason': {
      emoji = '🍼';
      const a = s.adoption;
      if (s.champion) {
        headline = `${esc(s.champion)} won the World Series`;
      } else if (a) {
        headline = a.eliminatedOn ? `${esc(a.teamName)} eliminated. Finding a new family…` : `Adopted: ${esc(a.teamName)}`;
      } else {
        headline = 'Postseason. Auditing playoff birth charts…';
      }
      const parts = [];
      const lp = s.lastPick;
      if (lp && lp.series) parts.push(esc(lp.series) + (lp.seriesResult ? ` · ${esc(lp.seriesResult)}` : ''));
      if (s.postseason) parts.push(`Picks ${s.postseason.correct}/${s.postseason.picks}`);
      if (a && a.reading) parts.push(`🌊 ${Math.round(a.reading.waterShare * 100)}% water signs`);
      sub = parts.join(' · ');
      if (s.postseason) side = `<div class="side"><b class="num">${s.postseason.correct}-${s.postseason.picks - s.postseason.correct}</b>postseason picks</div>`;
      break;
    }
    case 'offseason': {
      emoji = '🔥';
      headline = 'Hot stove season';
      const m = s.latestMove;
      sub = m ? `Latest: ${esc(m.description)}` : 'Waiting on the front office. As usual.';
      if (cd) sub += ` · Opening Day ${esc(fmtDate(cd.openingDay))}${cd.opponent ? ` ${cd.isHome ? 'vs' : '@'} ${esc(cd.opponent)}` : ''}`;
      side = countdownSide;
      break;
    }
    case 'spring-training': {
      emoji = '🌵';
      headline = "Spring training. It doesn't count. Neither does this.";
      sub = s.spring ? `Spring picks ${s.spring.correct}/${s.spring.picks}` : 'No spring picks yet';
      side = countdownSide;
      break;
    }
    default: {
      emoji = '⚾';
      headline = `${s.season} regular season`;
      const r = s.rockies;
      if (r) {
        sub = `Rockies ${r.rockiesWins}-${r.rockiesLosses} · Predictions ${r.correct}/${r.predictions}`;
        side = `<div class="side"><b class="num">${pct(r.correct, r.predictions)}</b>prediction accuracy</div>`;
      }
    }
  }
  el.innerHTML = `<div class="banner" role="status"><span class="emoji">${emoji}</span>
    <div class="main"><div class="headline">${headline}</div><div class="sub">${sub}</div></div>${side}</div>`;
}

// ── shared chart components ──────────────────────────────────────────

const completedOf = games => games.filter(g => g.actual && !g.synthetic);

function renderAccuracyChart(id, completed) {
  const labels = [], cum = [], rolling = [];
  let correct = 0;
  completed.forEach((g, i) => {
    if (g.predicted === g.actual) correct++;
    labels.push(g.date.slice(5));
    cum.push(+((correct / (i + 1)) * 100).toFixed(1));
    const win = completed.slice(Math.max(0, i - 9), i + 1);
    rolling.push(+((win.filter(w => w.predicted === w.actual).length / win.length) * 100).toFixed(1));
  });
  const hit = g => g.predicted === g.actual;

  chart(id, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Cumulative %', data: cum, borderColor: COLORS.primary, backgroundColor: alpha(COLORS.primary, 0.15),
          borderWidth: 2, fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 7,
          pointStyle: completed.map(g => hit(g) ? 'circle' : 'crossRot'),
          pointBackgroundColor: completed.map(g => hit(g) ? COLORS.good : COLORS.bad),
          pointBorderColor: completed.map(g => hit(g) ? COLORS.good : COLORS.bad),
        },
        { label: 'Rolling 10-game %', data: rolling, borderColor: COLORS.secondary, borderWidth: 2, borderDash: [5, 3], tension: 0.3, pointRadius: 0, fill: false },
        { label: '50% coin flip', data: cum.map(() => 50), borderColor: COLORS.neutral, borderWidth: 1, borderDash: [2, 4], pointRadius: 0, fill: false },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      interaction: { mode: 'index', intersect: false },
      onClick: (e, els) => { if (els.length) gameLog.filter(completed[els[0].index].opponent); },
      plugins: {
        ...CHART_DEFAULTS.plugins,
        legend: { labels: { color: COLORS.textDim, font: { size: 11 }, usePointStyle: true, pointStyle: 'line',
          generateLabels: c => Chart.defaults.plugins.legend.labels.generateLabels(c).map(l => {
            const ds = c.data.datasets[l.datasetIndex];
            return { ...l, strokeStyle: ds.borderColor, fillStyle: ds.borderColor, pointStyle: 'line', lineWidth: 2 };
          }) } },
        tooltip: {
          ...CHART_DEFAULTS.plugins.tooltip,
          callbacks: {
            afterTitle: items => {
              const g = completed[items[0].dataIndex];
              return `${g.opponent}: ${hit(g) ? '✓ Correct' : '✗ Wrong'}`;
            }
          }
        }
      },
      scales: { ...CHART_DEFAULTS.scales, y: { ...CHART_DEFAULTS.scales.y, min: 0, max: 100, ticks: { ...CHART_DEFAULTS.scales.y.ticks, callback: v => v + '%' } } }
    }
  });
}

function renderHoroscopeChart(id, titleId, completed, team) {
  const scored = completed.filter(g => g.factors && g.factors.stars && (g.teamScore > 0 || g.oppScore > 0));
  const wins = [], losses = [], xs = [], ys = [];
  scored.forEach(g => {
    const point = { x: g.factors.stars * 100, y: g.teamScore - g.oppScore, g };
    xs.push(point.x); ys.push(point.y);
    (g.actual === 'W' ? wins : losses).push(point);
  });
  const n = xs.length;
  let r = null;
  if (n >= 2) {
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    let num = 0, dx2 = 0, dy2 = 0;
    for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; num += dx * dy; dx2 += dx * dx; dy2 += dy * dy; }
    if (dx2 && dy2) r = num / Math.sqrt(dx2 * dy2);
  }
  const title = document.getElementById(titleId);
  if (title) title.textContent = `Horoscope vs Run Margin · cosmic r=${r === null ? '—' : r.toFixed(2)}`;

  chart(id, {
    type: 'scatter',
    data: {
      datasets: [
        { label: 'Win', data: wins, backgroundColor: alpha(COLORS.good, 0.75), borderColor: COLORS.good, pointRadius: 5, pointHoverRadius: 8 },
        { label: 'Loss', data: losses, backgroundColor: alpha(COLORS.bad, 0.75), borderColor: COLORS.bad, borderWidth: 2, pointStyle: 'crossRot', pointRadius: 6, pointHoverRadius: 9 },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: {
          ...CHART_DEFAULTS.plugins.tooltip,
          callbacks: {
            label: item => {
              const g = item.raw.g, m = g.teamScore - g.oppScore;
              return `${g.date} vs ${g.opponent}: stars ${item.raw.x.toFixed(0)}%, ${g.teamScore}-${g.oppScore} (${m > 0 ? '+' : ''}${m})`;
            }
          }
        },
        subtitle: scored.length ? { display: false } : {
          display: true, text: 'No finished games with horoscope + score data yet',
          color: COLORS.textDim, font: { size: 12, style: 'italic' }, padding: { top: 20 }
        }
      },
      scales: {
        x: { ...CHART_DEFAULTS.scales.x, min: 0, max: 100,
          title: { display: true, text: `Stars favor ${team} →`, color: COLORS.textDim, font: { size: 11 } },
          ticks: { ...CHART_DEFAULTS.scales.x.ticks, callback: v => v + '%' } },
        y: { ...CHART_DEFAULTS.scales.y,
          title: { display: true, text: `Run margin (${team} − Opp)`, color: COLORS.textDim, font: { size: 11 } },
          grid: { ...CHART_DEFAULTS.scales.y.grid,
            color: ctx => ctx.tick.value === 0 ? 'rgba(200,170,255,0.35)' : COLORS.grid,
            lineWidth: ctx => ctx.tick.value === 0 ? 1.5 : 1 } }
      }
    }
  });
}

function renderFactorChart(id, completed) {
  const correct = {}, total = {};
  FACTORS.forEach(([f]) => { correct[f] = 0; total[f] = 0; });
  completed.forEach(g => {
    const won = g.actual === 'W';
    FACTORS.forEach(([f]) => {
      const v = (g.factors || {})[f];
      if (v) { total[f]++; if ((v > 0.5) === won) correct[f]++; }
    });
  });
  chart(id, {
    type: 'bar',
    data: {
      labels: FACTORS.map(([, l]) => l),
      datasets: [{
        label: 'Accuracy %',
        data: FACTORS.map(([f]) => total[f] ? +((correct[f] / total[f]) * 100).toFixed(1) : null),
        backgroundColor: alpha(COLORS.primary, 0.75), borderColor: COLORS.primary, borderWidth: 1, borderRadius: 4, barThickness: 14,
      }]
    },
    options: {
      ...CHART_DEFAULTS,
      indexAxis: 'y',
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false },
        tooltip: { ...CHART_DEFAULTS.plugins.tooltip, callbacks: { afterLabel: item => `${total[FACTORS[item.dataIndex][0]]} games with data` } } },
      scales: {
        x: { ...CHART_DEFAULTS.scales.x, min: 0, max: 100,
          title: { display: true, text: '% of games where the factor leaned the right way', color: COLORS.textDim, font: { size: 11 } },
          ticks: { ...CHART_DEFAULTS.scales.x.ticks, callback: v => v + '%' } },
        y: { ...CHART_DEFAULTS.scales.y, grid: { display: false } }
      }
    }
  });
}

function renderWeightsChart(id, weights) {
  if (!weights) return;
  chart(id, {
    type: 'bar',
    data: {
      labels: FACTORS.map(([, l]) => l),
      datasets: [
        { label: 'Learned', data: FACTORS.map(([k]) => +((weights[k] || 0) * 100).toFixed(1)),
          backgroundColor: alpha(COLORS.primary, 0.8), borderColor: COLORS.primary, borderWidth: 1, borderRadius: 4, barThickness: 10 },
        { label: 'Starting default', data: FACTORS.map(([k]) => +(DEFAULT_WEIGHTS[k] * 100).toFixed(1)),
          backgroundColor: COLORS.neutral, borderRadius: 4, barThickness: 10 },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      indexAxis: 'y',
      plugins: { ...CHART_DEFAULTS.plugins, tooltip: { ...CHART_DEFAULTS.plugins.tooltip, callbacks: { label: i => `${i.dataset.label}: ${i.raw}%` } } },
      scales: {
        x: { ...CHART_DEFAULTS.scales.x, min: 0, ticks: { ...CHART_DEFAULTS.scales.x.ticks, callback: v => v + '%' } },
        y: { ...CHART_DEFAULTS.scales.y, grid: { display: false } }
      }
    }
  });
}

function renderOpponentChart(id, completed) {
  const opp = {};
  completed.forEach(g => {
    opp[g.opponent] = opp[g.opponent] || { correct: 0, wrong: 0 };
    g.predicted === g.actual ? opp[g.opponent].correct++ : opp[g.opponent].wrong++;
  });
  const sorted = Object.entries(opp).sort((a, b) => (b[1].correct + b[1].wrong) - (a[1].correct + a[1].wrong));
  const gap = { borderColor: COLORS.surface, borderWidth: { top: 2 }, borderSkipped: false, borderRadius: 4, maxBarThickness: 56 };
  chart(id, {
    type: 'bar',
    data: {
      labels: sorted.map(([n]) => isMobile() ? shortTeam(n) : n),
      datasets: [
        { label: '✓ Correct', data: sorted.map(([, v]) => v.correct), backgroundColor: COLORS.good, ...gap },
        { label: '✗ Wrong', data: sorted.map(([, v]) => v.wrong), backgroundColor: COLORS.bad, ...gap },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: { ...CHART_DEFAULTS.plugins, legend: { labels: { color: COLORS.textDim, font: { size: 11 } } } },
      scales: {
        x: { ...CHART_DEFAULTS.scales.x, stacked: true, grid: { display: false } },
        y: { ...CHART_DEFAULTS.scales.y, stacked: true, ticks: { ...CHART_DEFAULTS.scales.y.ticks, stepSize: 1 } }
      },
      onClick: (e, els) => { if (els.length) gameLog.filter(sorted[els[0].index][0]); }
    }
  });
}

// The standard prediction layout shared by regular season, postseason and
// spring: accuracy, horoscope, factors, (weights), opponents, game log.
function predictionPanels(prefix, completed, { weights, weightsTitle, team = 'Rockies' } = {}) {
  return `<div class="grid">
    ${panel('Prediction Accuracy Over Time', canvas(prefix + 'Acc', 280), { wide: true })}
    ${panel('Horoscope vs Run Margin', canvas(prefix + 'Horo'), { id: prefix + 'HoroTitle' })}
    ${panel('Factor Accuracy vs Actual Outcomes', canvas(prefix + 'Factor'))}
    ${weights ? panel(weightsTitle, canvas(prefix + 'Weights')) : ''}
    ${panel('Record by Opponent', canvas(prefix + 'Opp'), { wide: !weights })}
  </div>`;
}
function drawPredictionCharts(prefix, completed, { weights, team = 'Rockies' } = {}) {
  renderAccuracyChart(prefix + 'Acc', completed);
  renderHoroscopeChart(prefix + 'Horo', prefix + 'HoroTitle', completed, team);
  renderFactorChart(prefix + 'Factor', completed);
  if (weights) renderWeightsChart(prefix + 'Weights', weights);
  renderOpponentChart(prefix + 'Opp', completed);
}

const PAGE_SIZE = 20;
const gameLog = {
  games: [], filtered: [], page: 1, active: 'all', opts: {},

  html(title = 'Game Log') {
    return `<div class="game-log panel" style="margin-top:0">
      <h2>${title}</h2>
      <div class="filter-bar" id="filterBar"></div>
      <div class="table-scroll"><table><thead id="logHead"></thead><tbody id="logBody"></tbody></table></div>
      <div class="pagination" id="pagination"></div>
    </div>`;
  },

  mount(games, opts = {}) {
    this.games = games; this.opts = opts; this.page = 1;
    const opponents = [...new Set(games.filter(g => g.actual).map(g => g.opponent))];
    const bar = document.getElementById('filterBar');
    bar.innerHTML = `<span class="chip active" data-filter="all">All</span>` +
      opponents.map(o => `<span class="chip" data-filter="${esc(o)}">${esc(shortTeam(o))}</span>`).join('');
    bar.querySelectorAll('.chip').forEach(c => c.onclick = () => this.filter(c.dataset.filter));
    const cols = ['Date', ...(opts.series ? ['Series'] : []), ...(opts.team ? ['Team'] : []), 'Opponent', 'H/A', 'Predicted', 'Actual', 'Score', 'Win Prob', 'Result', ''];
    document.getElementById('logHead').innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
    this.filter('all');
  },

  filter(f) {
    if (!document.getElementById('logBody')) return;
    this.active = f; this.page = 1;
    document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
    this.filtered = (f === 'all' ? this.games.slice() : this.games.filter(g => g.opponent === f)).reverse();
    this.render();
  },

  go(p) {
    const pages = Math.ceil(this.filtered.length / PAGE_SIZE);
    if (p < 1 || p > pages) return;
    this.page = p; this.render();
  },

  render() {
    const body = document.getElementById('logBody');
    if (!body) return;
    const pages = Math.max(1, Math.ceil(this.filtered.length / PAGE_SIZE));
    this.page = Math.min(this.page, pages);
    const rows = this.filtered.slice((this.page - 1) * PAGE_SIZE, this.page * PAGE_SIZE);
    const m = isMobile();

    body.innerHTML = rows.length ? rows.map(g => {
      const done = g.actual && !g.synthetic, ok = done && g.predicted === g.actual;
      const resultClass = g.synthetic ? 'pending' : !done ? 'pending' : ok ? 'correct' : 'wrong';
      const resultText = g.synthetic ? 'backfill' : !done ? 'Pending' : ok ? '✓ Correct' : '✗ Wrong';
      const tag = v => v === 'W' ? 'tag-w' : v === 'L' ? 'tag-l' : 'tag-na';
      const score = (g.teamScore || g.oppScore) ? `${g.teamScore}-${g.oppScore}` : '—';
      return `<tr>
        <td>${esc(m ? g.date.slice(5) : g.date)}</td>
        ${this.opts.series ? `<td title="${esc(g.seriesResult)}">${esc(m ? String(g.series || '—').replace(' Game ', ' G') : (g.series || '—'))}</td>` : ''}
        ${this.opts.team ? `<td>${esc(teamName(g.team))}</td>` : ''}
        <td>${esc(teamName(g.opponent))}</td>
        <td>${m ? (g.isHome ? 'H' : 'A') : (g.isHome ? 'Home' : 'Away')}</td>
        <td><span class="tag ${g.synthetic ? 'tag-na' : tag(g.predicted)}">${g.synthetic ? '—' : esc(g.predicted)}</span></td>
        <td><span class="tag ${tag(g.actual)}">${esc(g.actual || '—')}</span></td>
        <td class="num">${score}</td>
        <td class="num">${g.synthetic ? '—' : Math.round(g.winProbability * 100) + '%'}</td>
        <td class="${resultClass}">${resultText}</td>
        <td>${postLink(g.postUrl, '🔗')}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="12" class="pending" style="text-align:center;padding:24px">No games yet.</td></tr>`;

    const pag = document.getElementById('pagination');
    if (pages <= 1) { pag.innerHTML = ''; return; }
    let html = `<button onclick="gameLog.go(${this.page - 1})" ${this.page === 1 ? 'disabled' : ''}>&lsaquo;</button>`;
    for (let p = 1; p <= pages; p++) html += `<button class="${p === this.page ? 'active' : ''}" onclick="gameLog.go(${p})">${p}</button>`;
    html += `<button onclick="gameLog.go(${this.page + 1})" ${this.page === pages ? 'disabled' : ''}>&rsaquo;</button>`;
    html += `<span class="page-info">${this.filtered.length} games</span>`;
    pag.innerHTML = html;
  },
};

function reportCardPanel(s) {
  if (!s || !s.predictions) return '';
  const call = (c, emoji, label) => c ? `<div class="item"><div class="k">${emoji} ${label}</div>
    ${esc(fmtDate(c.date))} ${c.isHome ? 'vs' : '@'} ${esc(nickname(c.opponent))}. Said <b>${esc(c.predicted)}</b> at
    ${Math.round((c.predicted === 'W' ? c.winProbability : 1 - c.winProbability) * 100)}%, got ${esc(c.actual)} ${c.rockiesScore}-${c.oppScore}.</div>` : '';
  const starsAcc = s.factorSamples && s.factorSamples.stars ? Math.round(s.factorAccuracy.stars * 100) + '%' : '—';
  const drift = s.finalWeights && s.startWeights
    ? `${Math.round(s.startWeights.stars * 100)}% → ${Math.round(s.finalWeights.stars * 100)}%` : '—';
  return `<div class="grid" style="margin-bottom:16px">${panel(`📜 ${s.season} Report Card`, `<div class="report">
    <div class="item"><div class="k">🔮 Verdict</div>${s.correct}/${s.predictions} correct (${pct(s.correct, s.predictions)}).
      Picked a loss ${s.pickedLosses} times.</div>
    ${call(s.bestCall, '🎯', 'Best call')}
    ${call(s.worstMiss, '💀', 'Worst miss')}
    <div class="item"><div class="k">⭐ The stars</div>Leaned the right way ${starsAcc} of the time.
      Trust in the stars: ${drift}.</div>
    <div class="item"><div class="k">🔥 Longest correct streak</div>${s.longestCorrectStreak} games</div>
  </div>`, { wide: true })}</div>`;
}

function renderRegular(main, d) {
  const games = d.regular;
  const completed = games.filter(g => g.actual);
  const real = completedOf(games);
  const correct = real.filter(g => g.predicted === g.actual).length;
  const wins = completed.filter(g => g.actual === 'W').length, losses = completed.length - wins;
  const acc = baseballPct(correct, real.length, 'Accuracy');
  const win = baseballPct(wins, wins + losses, 'Win %');
  const finished = !d.live || (d.phase && d.phase !== 'regular-season');
  const weightsTitle = d.live && d.phase === 'regular-season' ? 'Current Factor Weights' : 'Final Factor Weights';

  main.innerHTML = statCards([
    { value: `${correct}-${real.length - correct}`, label: 'Prediction Record' },
    { value: acc.value, label: acc.label },
    { value: `${wins}-${losses}`, label: 'Rockies Record' },
    { value: win.value, label: win.label },
  ]) + (finished ? reportCardPanel(d.summary) : '')
    + predictionPanels('reg', real, { weights: d.weights, weightsTitle })
    + gameLog.html();
  drawPredictionCharts('reg', real, { weights: d.weights });
  gameLog.mount(games);
}

function renderPostseason(main, d) {
  const ps = d.postseason;
  const games = ps.games;
  const real = completedOf(games);
  const correct = real.filter(g => g.predicted === g.actual).length;
  const wins = real.filter(g => g.actual === 'W').length;
  const acc = baseballPct(correct, real.length, 'Accuracy');
  const champ = ps.champion;

  const cards = ps.adoptions.map((a, i) => {
    const isChamp = champ && a.teamName === champ;
    const current = !a.eliminatedOn && !champ && i === ps.adoptions.length - 1;
    const fate = isChamp ? `<div class="fate won">🏆 World Series champions</div>`
      : a.eliminatedOn ? `<div class="fate out">🪦 Eliminated ${esc(fmtDate(a.eliminatedOn))}</div>`
      : champ ? `<div class="fate out">🪦 Eliminated</div>`
      : `<div class="fate alive">● Still alive</div>`;
    const r = a.reading || {};
    return `<div class="adopt-card${isChamp ? ' champ' : current ? ' current' : ''}">
      <div class="team">${i === 0 ? '🍼' : '🔁'} ${esc(a.teamName)}</div>
      <div class="when">Adopted ${esc(fmtDate(a.adoptedOn))}</div>
      <div class="reading">🌊 ${Math.round((r.waterShare || 0) * 100)}% water signs<br>
        ♋ Compatibility ${(r.score || 0).toFixed(1)}/3<br>
        ${SIGN_EMOJI[r.dominant] || '✨'} Dominant sign: ${esc(r.dominant || '?')}</div>
      ${fate}
    </div>`;
  }).join('');
  const champCard = champ && !ps.adoptions.some(a => a.teamName === champ)
    ? `<div class="adopt-card champ"><div class="team">🏆 ${esc(champ)}</div><div class="when">${esc(fmtDate(ps.championDate))}</div>
       <div class="reading">Won it all without our blessing.</div></div>` : '';

  main.innerHTML = statCards([
    { value: `${correct}-${real.length - correct}`, label: 'Postseason Picks' },
    { value: acc.value, label: acc.label },
    { value: `${wins}-${real.length - wins}`, label: 'Adopted Teams in Picked Games' },
    { value: ps.adoptions.length, label: ps.adoptions.length === 1 ? 'Team Adopted' : 'Teams Adopted' },
  ]) + `<div class="grid">
      ${panel('🍼 Adoption Agency', ps.adoptions.length || champCard ? `<div class="adoptions">${cards}${champCard}</div>`
        : '<div class="empty">No adoptions yet.</div>', { wide: true })}
      ${ps.audits.length ? panel('🔭 Playoff Birth-Chart Audit', canvas('psAudit', Math.max(160, ps.audits.length * 34), { keep: true }), { wide: true }) : ''}
    </div>`
    + predictionPanels('ps', real, { team: 'adopted team' })
    + gameLog.html('Adopted Team Game Log');

  if (ps.audits.length) {
    const audits = ps.audits;
    chart('psAudit', {
      type: 'bar',
      data: {
        labels: audits.map(a => (a.adopted ? '🍼 ' : '') + (isMobile() ? shortTeam(a.team) : a.team)),
        datasets: [{
          label: 'Cancer compatibility',
          data: audits.map(a => +a.reading.score.toFixed(2)),
          backgroundColor: audits.map(a => a.adopted ? COLORS.primary : COLORS.neutral),
          borderRadius: 4, barThickness: 14,
        }]
      },
      options: {
        ...CHART_DEFAULTS,
        indexAxis: 'y',
        plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false },
          tooltip: { ...CHART_DEFAULTS.plugins.tooltip, callbacks: {
            label: i => `Compatibility ${i.raw}/3`,
            afterLabel: i => { const r = audits[i.dataIndex].reading;
              return `${Math.round(r.waterShare * 100)}% water signs · mostly ${r.dominant} · ${r.players} players${audits[i.dataIndex].adopted ? '\n🍼 Adopted' : ''}`; } } } },
        scales: {
          x: { ...CHART_DEFAULTS.scales.x, min: 0, max: 3, title: { display: true, text: 'Mean Cancer compatibility (0 = mismatch, 3 = soulmates)', color: COLORS.textDim, font: { size: 11 } } },
          y: { ...CHART_DEFAULTS.scales.y, grid: { display: false } }
        }
      }
    });
  }
  drawPredictionCharts('ps', real, { team: 'adopted team' });
  gameLog.mount(games, { series: true, team: true });
}

function renderSpring(main, d) {
  const games = d.spring;
  const real = completedOf(games);
  const correct = real.filter(g => g.predicted === g.actual).length;
  const wins = real.filter(g => g.actual === 'W').length;
  const acc = baseballPct(correct, real.length, 'Accuracy');
  const win = baseballPct(wins, real.length, 'Spring Win %');

  main.innerHTML = statCards([
    { value: `${correct}-${real.length - correct}`, label: 'Spring Picks' },
    { value: acc.value, label: acc.label },
    { value: `${wins}-${real.length - wins}`, label: 'Rockies Spring Record' },
    { value: win.value, label: win.label },
  ]) + `<p class="note">🌵 Spring games don't count. Neither do these picks. They never touch the regular-season model.</p>`
    + predictionPanels('sp', real)
    + gameLog.html('Spring Game Log');
  drawPredictionCharts('sp', real);
  gameLog.mount(games);
}

function renderHotStove(main, d) {
  const moves = d.hotStove;
  const arrivals = moves.filter(m => m.arriving).length;
  const signCounts = {};
  moves.forEach(m => { if (m.sign) signCounts[m.sign] = (signCounts[m.sign] || 0) + 1; });
  const topSign = Object.entries(signCounts).sort((a, b) => b[1] - a[1])[0];
  const cd = d.live ? app.status?.countdown : null;

  const feed = moves.length ? `<ul class="feed">${moves.map(m => `<li>
      <span class="icon">${TXN_EMOJI[m.typeCode] || '📋'}</span>
      <div class="body">${esc(m.description)}
        <div class="meta">${esc(fmtDate(m.date))}
          ${m.sign ? ` · ${m.signEmoji || ''} ${esc(m.sign)}` : ''}
          ${m.compatibilityLabel ? ` · ♋ ${esc(m.compatibilityLabel)}` : !m.arriving ? ' · no longer our problem' : ''}
          ${m.digest ? ' · in a roundup' : ''}</div>
      </div>${postLink(m.postUrl)}</li>`).join('')}</ul>`
    : '<div class="empty"><span class="big">🧊</span>No roster moves yet. The front office is, as ever, deliberating.</div>';

  main.innerHTML = statCards([
    ...(cd ? [{ value: cd.days, label: `Days to Opening Day (${fmtDate(cd.openingDay)})` }] : []),
    { value: moves.length, label: 'Moves Posted' },
    { value: `${arrivals} / ${moves.length - arrivals}`, label: 'Arrivals / Departures' },
    { value: topSign ? `${SIGN_EMOJI[topSign[0]]} ${topSign[0]}` : '—', label: 'Most Common Sign' },
  ]) + `<div class="grid">
      ${panel('🔥 Hot Stove Feed', feed, { wide: !Object.keys(signCounts).length })}
      ${Object.keys(signCounts).length ? panel('♋ Signs on the Move', canvas('hsSigns', 340, { keep: true })) : ''}
    </div>`;

  if (Object.keys(signCounts).length) {
    const count = (sign, arriving) => moves.filter(m => m.sign === sign && m.arriving === arriving).length;
    const gap = { borderColor: COLORS.surface, borderWidth: { top: 2 }, borderSkipped: false, borderRadius: 4, maxBarThickness: 16 };
    chart('hsSigns', {
      type: 'bar',
      data: {
        labels: SIGNS.map(s => `${SIGN_EMOJI[s]} ${isMobile() ? s.slice(0, 3) : s}`),
        datasets: [
          { label: 'Arriving', data: SIGNS.map(s => count(s, true)), backgroundColor: COLORS.primary, ...gap },
          { label: 'Departing', data: SIGNS.map(s => count(s, false)), backgroundColor: COLORS.secondary, ...gap },
        ]
      },
      options: {
        ...CHART_DEFAULTS,
        indexAxis: 'y',
        plugins: { ...CHART_DEFAULTS.plugins, legend: { labels: { color: COLORS.textDim, font: { size: 11 } } } },
        scales: {
          x: { ...CHART_DEFAULTS.scales.x, stacked: true, ticks: { ...CHART_DEFAULTS.scales.x.ticks, stepSize: 1 } },
          y: { ...CHART_DEFAULTS.scales.y, stacked: true, grid: { display: false } }
        }
      }
    });
  }
}

function renderAllTime(main) {
  const seasons = app.seasons.slice().sort((a, b) => a.season - b.season);
  const withPreds = seasons.filter(s => s.summary && s.summary.predictions);
  const totC = withPreds.reduce((a, s) => a + s.summary.correct, 0);
  const totP = withPreds.reduce((a, s) => a + s.summary.predictions, 0);
  const best = withPreds.slice().sort((a, b) => b.summary.correct / b.summary.predictions - a.summary.correct / a.summary.predictions)[0];
  const psC = seasons.reduce((a, s) => a + (s.postseason ? s.postseason.correct : 0), 0);
  const psP = seasons.reduce((a, s) => a + (s.postseason ? s.postseason.picks : 0), 0);

  const rows = seasons.slice().reverse().map(s => {
    const sm = s.summary;
    const ps = s.postseason;
    return `<tr class="clickable" onclick="go(${s.season})">
      <td><b>${s.season}</b>${s.live ? ' <span class="live-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)"></span>' : ''}</td>
      <td class="num">${sm ? `${sm.rockiesWins}-${sm.rockiesLosses}` : '—'}</td>
      <td class="num">${sm && sm.predictions ? `${sm.correct}/${sm.predictions} (${pct(sm.correct, sm.predictions)})` : '—'}</td>
      <td>${ps && ps.adopted ? ps.adopted.map(t => esc(nickname(t))).join(' → ') : '—'}</td>
      <td class="num">${ps && ps.picks ? `${ps.correct}/${ps.picks}` : '—'}</td>
      <td class="num">${s.spring && s.spring.picks ? `${s.spring.correct}/${s.spring.picks}` : '—'}</td>
      <td class="num">${s.hotStoveMoves || '—'}</td>
      <td>${s.champion ? '🏆 ' + esc(nickname(s.champion)) : '—'}</td>
    </tr>`;
  }).join('');

  const weightRows = withPreds.slice().reverse().map(s => `<tr>
      <td><b>${s.season}</b></td>
      ${FACTORS.map(([k]) => `<td class="num">${Math.round((s.summary.finalWeights[k] || 0) * 100)}%</td>`).join('')}
    </tr>`).join('');

  main.innerHTML = statCards([
    { value: seasons.length, label: 'Seasons Tracked' },
    { value: `${totC}/${totP}`, label: `All-time Predictions (${pct(totC, totP)})` },
    { value: best ? best.season : '—', label: best ? `Best Season (${pct(best.summary.correct, best.summary.predictions)})` : 'Best Season' },
    { value: psP ? `${psC}/${psP}` : '—', label: 'All-time Postseason Picks' },
  ]) + `<div class="grid">
      ${panel('Prediction Accuracy by Season', canvas('atAcc'))}
      ${panel('Rockies Win % by Season', canvas('atWin'))}
    </div>
    <div class="game-log panel" style="margin-bottom:20px"><h2>Season by Season</h2><div class="table-scroll"><table>
      <thead><tr><th>Season</th><th>Rockies</th><th>Predictions</th><th>Adopted</th><th>Postseason Picks</th><th>Spring Picks</th><th>Hot Stove</th><th>Champion</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    ${weightRows ? `<div class="game-log panel"><h2>🧠 Final Weights by Season</h2><div class="table-scroll"><table>
      <thead><tr><th>Season</th>${FACTORS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
      <tbody>${weightRows}<tr><td class="pending">default</td>${FACTORS.map(([k]) => `<td class="num pending">${Math.round(DEFAULT_WEIGHTS[k] * 100)}%</td>`).join('')}</tr></tbody>
      </table></div></div>` : ''}`;

  const bars = (id, label, values, color, tooltip) => chart(id, {
    type: 'bar',
    data: { labels: seasons.map(s => s.season), datasets: [{ label, data: values, backgroundColor: color, borderRadius: 4, maxBarThickness: 48 }] },
    options: {
      ...CHART_DEFAULTS,
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false }, tooltip: { ...CHART_DEFAULTS.plugins.tooltip, callbacks: { label: tooltip } } },
      scales: { x: { ...CHART_DEFAULTS.scales.x, grid: { display: false } },
        y: { ...CHART_DEFAULTS.scales.y, min: 0, max: 100, ticks: { ...CHART_DEFAULTS.scales.y.ticks, callback: v => v + '%' } } }
    }
  });
  bars('atAcc', 'Accuracy', seasons.map(s => s.summary && s.summary.predictions ? +(s.summary.correct / s.summary.predictions * 100).toFixed(1) : null),
    COLORS.primary, i => { const s = seasons[i.dataIndex].summary; return `${i.raw}% (${s.correct}/${s.predictions})`; });
  bars('atWin', 'Win %', seasons.map(s => s.summary && (s.summary.rockiesWins + s.summary.rockiesLosses) ? +(s.summary.rockiesWins / (s.summary.rockiesWins + s.summary.rockiesLosses) * 100).toFixed(1) : null),
    COLORS.secondary, i => { const s = seasons[i.dataIndex].summary; return `${i.raw}% (${s.rockiesWins}-${s.rockiesLosses})`; });
}

// ── boot ─────────────────────────────────────────────────────────────

async function init() {
  try {
    [app.status, app.seasons] = await Promise.all([getJSON('/api/status'), getJSON('/api/seasons')]);
  } catch (e) {
    document.getElementById('view').innerHTML = emptyState('🌑', `The dashboard couldn't reach the bot: ${esc(e.message)}`);
    return;
  }
  renderBanner(app.status);
  window.addEventListener('hashchange', route);
  route();
}

let lastMobile = isMobile();
window.addEventListener('resize', () => {
  if (isMobile() !== lastMobile) { lastMobile = isMobile(); route(); }
  else gameLog.render();
});
init();
</script>
</body>
</html>
